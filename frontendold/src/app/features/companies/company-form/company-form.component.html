<section>
  <h2>Company</h2>

  <form [formGroup]="companyForm" (ngSubmit)="submit()">
    <label for="businessName">Business name</label>
    <input id="businessName" type="text" formControlName="businessName" />

    <label for="taxId">Tax id</label>
    <input id="taxId" type="text" formControlName="taxId" />

    <label for="contactEmail">Contact email</label>
    <input id="contactEmail" type="email" formControlName="contactEmail" />

    <label for="phoneNumber">Phone number</label>
    <input id="phoneNumber" type="tel" formControlName="phoneNumber" />

    <label for="address">Address</label>
    <input id="address" type="text" formControlName="address" />

    <button type="submit" [disabled]="isSubmitting()">Save</button>
  </form>
</section>
