<section>
  <h2>Personalized evaluation</h2>

  <form [formGroup]="evaluationForm" (ngSubmit)="submit()">
    <label for="appointmentId">Appointment</label>
    <input id="appointmentId" type="number" formControlName="appointmentId" />

    <label for="diagnosis">Diagnosis</label>
    <textarea id="diagnosis" formControlName="diagnosis" rows="4"></textarea>

    <label for="recommendations">Recommendations</label>
    <textarea id="recommendations" formControlName="recommendations" rows="4"></textarea>

    <label for="riskLevel">Risk level</label>
    <select id="riskLevel" formControlName="riskLevel">
      @for (riskLevel of riskLevelList; track riskLevel) {
        <option [value]="riskLevel">{{ riskLevel }}</option>
      }
    </select>

    <button type="submit" [disabled]="isSubmitting()">Save</button>
  </form>

  @if (savedEvaluation(); as evaluation) {
    <button type="button" (click)="downloadReport(evaluation.id)">Download PDF report</button>
  }
</section>
