<section>
  <h2>Companies</h2>

  <a routerLink="/companies/new">New company</a>

  <table>
    <thead>
      <tr>
        <th>Business name</th>
        <th>Tax id</th>
        <th>Contact email</th>
        <th>Active</th>
      </tr>
    </thead>
    <tbody>
      @for (company of companyList(); track company.id) {
        <tr>
          <td><a [routerLink]="['/companies', company.id]">{{ company.businessName }}</a></td>
          <td>{{ company.taxId }}</td>
          <td>{{ company.contactEmail }}</td>
          <td>{{ company.active ? 'Yes' : 'No' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">No company registered yet.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
