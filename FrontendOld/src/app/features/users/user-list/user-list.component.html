<section>
  <h2>Users</h2>

  <a routerLink="/users/new">New user</a>

  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Active</th>
      </tr>
    </thead>
    <tbody>
      @for (user of userList(); track user.id) {
        <tr>
          <td>
            <a [routerLink]="['/users', user.id]">
              {{ user.firstName }} {{ user.firstLastName }}
            </a>
          </td>
          <td>{{ user.email }}</td>
          <td>{{ user.role }}</td>
          <td>{{ user.active ? 'Yes' : 'No' }}</td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4">No user registered yet.</td>
        </tr>
      }
    </tbody>
  </table>
</section>
