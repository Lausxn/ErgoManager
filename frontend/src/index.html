<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <title>ErgoManager · Madrigal Group Solutions</title>
        <base href="/" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="ErgoManager, sistema de gestión ergonómica de Madrigal Group Solutions." />
        <link rel="icon" type="image/png" href="favicon.png" />
        <!-- Font Awesome Free icons (fa-solid / fa-regular), used next to PrimeIcons where they read better. -->
        <script>
            // Nest the SVG inside the <i> instead of replacing it, so Angular keeps control of the element and its classes.
            window.FontAwesomeConfig = { autoReplaceSvg: 'nest' };
        </script>
        <script src="https://kit.fontawesome.com/bed4803412.js" crossorigin="anonymous"></script>
        <script>
            // Applies the stored theme and page size before Angular starts, so the page does not flash.
            (function () {
                var fontSizes = { small: 13, normal: 15, large: 17, extraLarge: 19 };
                var preferences = {};
                try {
                    preferences = JSON.parse(localStorage.getItem('ergomanager.preferences') || '{}');
                } catch (error) {}
                if (preferences.darkTheme === true) document.documentElement.classList.add('app-dark');
                document.documentElement.style.fontSize = (fontSizes[preferences.pageSize] || 15) + 'px';
            })();
        </script>
    </head>

    <body>
        <app-root></app-root>
    </body>
</html>
