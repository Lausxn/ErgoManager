<section>
  <h2>User</h2>

  <form [formGroup]="userForm" (ngSubmit)="submit()">
    <label for="firstName">First name</label>
    <input id="firstName" type="text" formControlName="firstName" />

    <label for="firstLastName">First last name</label>
    <input id="firstLastName" type="text" formControlName="firstLastName" />

    <label for="secondLastName">Second last name</label>
    <input id="secondLastName" type="text" formControlName="secondLastName" />

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" />

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password" autocomplete="new-password" />

    <label for="role">Role</label>
    <select id="role" formControlName="role">
      @for (role of roleList; track role) {
        <option [value]="role">{{ role }}</option>
      }
    </select>

    <button type="submit" [disabled]="isSubmitting()">Save</button>
  </form>
</section>
