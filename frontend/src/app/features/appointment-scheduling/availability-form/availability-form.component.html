<section>
  <h2>Availability</h2>

  <form [formGroup]="availabilityForm" (ngSubmit)="submit()">
    <label for="startDateTime">Starts</label>
    <input id="startDateTime" type="datetime-local" formControlName="startDateTime" />

    <label for="endDateTime">Ends</label>
    <input id="endDateTime" type="datetime-local" formControlName="endDateTime" />

    <button type="submit" [disabled]="isSubmitting()">Publish</button>
  </form>
</section>
