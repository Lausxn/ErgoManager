<div class="password-reminder-region" aria-live="polite">
    @if (visible()) {
        <section
            class="password-reminder"
            role="region"
            aria-labelledby="password-reminder-title"
            aria-describedby="password-reminder-message"
            [class.password-reminder--paused]="isPaused()"
            [style.--password-reminder-duration.ms]="autoHideMs"
            [@reminder]="{ value: '', params: { duration: motionMs } }"
            (mouseenter)="pause()"
            (mouseleave)="resume()"
            (focusin)="pause()"
            (focusout)="onFocusOut($event)"
            (keydown.escape)="closePopup()"
        >
            <span class="password-reminder__icon" aria-hidden="true">
                <i class="fa-solid fa-lock"></i>
            </span>

            <div class="password-reminder__body">
                <h2 id="password-reminder-title" class="password-reminder__title">Su contraseña es temporal</h2>
                <p id="password-reminder-message" class="password-reminder__message">Cámbiela para proteger su cuenta.</p>
            </div>

            <p-button icon="fa-solid fa-xmark" severity="secondary" [text]="true" [rounded]="true" size="small" ariaLabel="Cerrar aviso" (onClick)="closePopup()" />

            <div class="password-reminder__actions">
                <p-button label="Ahora no" severity="secondary" [text]="true" size="small" (onClick)="closePopup()" />
                <p-button label="Cambiar contraseña" icon="fa-solid fa-key" size="small" (onClick)="requestPasswordUpdate()" />
            </div>

            <span class="password-reminder__timer" aria-hidden="true"></span>
        </section>
    }
</div>
