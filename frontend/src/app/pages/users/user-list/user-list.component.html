<app-page-header eyebrow="Administración" title="Usuarios" subtitle="Administradores y ergonomistas con acceso a ErgoManager.">
    <p-button label="Nuevo usuario" icon="pi pi-user-plus" routerLink="/users/new" />
</app-page-header>

<div class="mgs-card !p-0 overflow-hidden">
    <p-table #table [value]="userList()" [loading]="isLoading()" [paginator]="true" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]" [globalFilterFields]="['firstName', 'firstLastName', 'secondLastName', 'email']" [rowHover]="true" dataKey="id">
        <ng-template #caption>
            <div class="flex flex-wrap items-center justify-between gap-4 p-2">
                <span class="mgs-section-title !m-0">Usuarios registrados</span>
                <p-iconfield>
                    <p-inputicon class="pi pi-search" />
                    <input pInputText type="text" (input)="filterTable(table, $event)" placeholder="Buscar usuario" aria-label="Buscar usuario" />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th pSortableColumn="firstName">Nombre <p-sortIcon field="firstName" /></th>
                <th pSortableColumn="email">Correo <p-sortIcon field="email" /></th>
                <th pSortableColumn="role">Rol <p-sortIcon field="role" /></th>
                <th pSortableColumn="active">Estado <p-sortIcon field="active" /></th>
                <th class="w-32"></th>
            </tr>
        </ng-template>
        <ng-template #body let-user>
            <tr>
                <td class="font-semibold">{{ user.firstName }} {{ user.firstLastName }} {{ user.secondLastName }}</td>
                <td>{{ user.email }}</td>
                <td>{{ roleLabels[user.role] }}</td>
                <td>
                    <p-tag [value]="user.active ? 'Activo' : 'Inactivo'" [styleClass]="user.active ? activeTagClasses.active : activeTagClasses.inactive" />
                </td>
                <td class="text-right whitespace-nowrap">
                    <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" severity="secondary" [routerLink]="['/users', user.id]" pTooltip="Editar" ariaLabel="Editar" />
                    @if (user.active && !isCurrentUser(user)) {
                        <p-button icon="pi pi-ban" [rounded]="true" [text]="true" (onClick)="confirmDeactivate(user)" pTooltip="Desactivar" ariaLabel="Desactivar" />
                    }
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="5" class="text-center py-10 text-muted-color">Todavía no hay usuarios registrados.</td>
            </tr>
        </ng-template>
    </p-table>
</div>
