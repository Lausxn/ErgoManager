<app-page-header eyebrow="Usuarios" [title]="isEditing() ? 'Editar usuario' : 'Nuevo usuario'" subtitle="Datos personales, acceso y rol dentro de ErgoManager." />

<form [formGroup]="userForm" (ngSubmit)="submit()" class="mgs-card" novalidate>
    <h2 class="mgs-section-title">Datos personales</h2>
    <div class="mgs-form-grid">
        <div class="mgs-field mgs-field--half">
            <label for="firstName">Nombre</label>
            <input pInputText id="firstName" formControlName="firstName" />
            @if (isInvalid('firstName')) {
                <small class="mgs-field__error">El nombre es obligatorio.</small>
            }
        </div>

        <div class="mgs-field mgs-field--half">
            <label for="firstLastName">Primer apellido</label>
            <input pInputText id="firstLastName" formControlName="firstLastName" />
            @if (isInvalid('firstLastName')) {
                <small class="mgs-field__error">El primer apellido es obligatorio.</small>
            }
        </div>

        <div class="mgs-field mgs-field--half">
            <label for="secondLastName">Segundo apellido <span class="text-muted-color font-normal">(opcional)</span></label>
            <input pInputText id="secondLastName" formControlName="secondLastName" />
        </div>
    </div>

    <h2 class="mgs-section-title mt-8">Acceso</h2>
    <div class="mgs-form-grid">
        <div class="mgs-field mgs-field--half">
            <label for="email">Correo electrónico</label>
            <input pInputText id="email" type="email" formControlName="email" autocomplete="off" />
            @if (isInvalid('email')) {
                <small class="mgs-field__error">Escriba un correo válido.</small>
            }
        </div>

        <div class="mgs-field mgs-field--half">
            <label for="password">Contraseña</label>
            <p-password inputId="password" formControlName="password" [toggleMask]="true" [fluid]="true" autocomplete="new-password" weakLabel="Débil" mediumLabel="Media" strongLabel="Fuerte" promptLabel="Mínimo 8 caracteres" />
            @if (isInvalid('password')) {
                <small class="mgs-field__error">La contraseña debe tener al menos 8 caracteres.</small>
            }
        </div>

        <div class="mgs-field mgs-field--half">
            <label for="role">Rol</label>
            <p-select inputId="role" formControlName="role" [options]="roleOptions" optionLabel="label" optionValue="value" [fluid]="true" />
        </div>
    </div>

    <div class="mgs-form-actions">
        <p-button label="Cancelar" severity="secondary" [outlined]="true" routerLink="/users" />
        <p-button type="submit" label="Guardar" icon="pi pi-check" [loading]="isSubmitting()" />
    </div>
</form>
