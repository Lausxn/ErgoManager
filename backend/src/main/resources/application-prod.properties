# ===== Database =====
# Every value comes from the environment, no credential is stored in the repository.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# "validate" fails at start up when the schema does not match the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ===== Logging =====
logging.level.com.mgs.ergomanager=INFO

# ===== OpenAPI =====
# The interactive documentation is not published outside development.
springdoc.swagger-ui.enabled=false
