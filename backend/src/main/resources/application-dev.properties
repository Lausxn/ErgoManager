# ===== Database =====
spring.datasource.url=jdbc:mysql://localhost:3306/ergo_manager_db?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===== JPA / Hibernate =====
# "update" keeps the local schema in sync while the model is still changing.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ===== Logging =====
logging.level.com.mgs.ergomanager=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===== Mail =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true