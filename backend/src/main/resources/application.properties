# ===== Application =====
spring.application.name=ergomanager
spring.profiles.active=dev
server.port=8080

# ===== JPA / Hibernate =====
# Hibernate never renames anything: every table and column name comes from the
# explicit @Table and @Column annotations of the entities.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===== JSON =====
# Jackson 3 already serialises dates as ISO-8601 strings, only the null
# handling needs to be configured here.
spring.jackson.default-property-inclusion=non_null

# ===== Security =====
# The secret must be at least 32 characters long, it is the key of the HS256
# signature. Override it with the JWT_SECRET environment variable.
ergomanager.security.jwt.secret=${JWT_SECRET:change-this-development-secret-key-32-chars-min}
ergomanager.security.jwt.expiration-ms=86400000

# ===== CORS =====
# Origins allowed to call /api/**, the Angular application runs on port 4200.
ergomanager.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ===== OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
